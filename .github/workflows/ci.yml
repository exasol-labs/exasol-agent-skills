name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  validate-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate marketplace manifest
        run: |
          jq empty .claude-plugin/marketplace.json
          jq -e '.name and .owner.name and .metadata.version and .plugins' .claude-plugin/marketplace.json
      - name: Validate plugin manifest
        run: |
          jq empty plugins/exasol/.claude-plugin/plugin.json
          jq -e '.name and .version and .author.name' plugins/exasol/.claude-plugin/plugin.json
      - name: Check version consistency
        run: sh .github/scripts/validate-package-version.sh
      - name: Test release tag validation
        run: sh test/test-release-tag.sh
      - name: Check version is bumped
        if: github.event_name == 'pull_request'
        run: sh .github/scripts/validate-package-version.sh --newer-than-tags

  test-installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build test image
        run: docker build -f Dockerfile.test -t installer-test .
      - name: "Test: fresh install"
        run: docker run --rm -e SCENARIO=fresh installer-test sh test/test-installer.sh
      - name: "Test: explicit exapump install"
        run: docker run --rm -e SCENARIO=fresh-exapump installer-test sh test/test-installer.sh
      - name: "Test: exapump release lookup failure"
        run: docker run --rm -e SCENARIO=exapump-api-failure installer-test sh test/test-installer.sh
      - name: "Test: idempotent re-run"
        run: docker run --rm -e SCENARIO=idempotent installer-test sh test/test-installer.sh
      - name: "Test: update from older version"
        run: docker run --rm -e SCENARIO=update installer-test sh test/test-installer.sh
      - name: "Test: fresh install (Claude Code only)"
        run: docker run --rm -e SCENARIO=fresh-claude installer-test sh test/test-installer.sh
      - name: "Test: fresh install (Codex only)"
        run: docker run --rm -e SCENARIO=fresh-codex installer-test sh test/test-installer.sh
      - name: "Test: reject empty Codex installation"
        run: docker run --rm -e SCENARIO=codex-verification-failure installer-test sh test/test-installer.sh
      - name: "Test: curl-piped interactive Codex selection"
        run: docker run --rm -e SCENARIO=piped-interactive-codex installer-test sh test/test-installer.sh

  check-links:
    name: Check Links
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Repository
        id: check-out-repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js Environment
        id: set-up-node-js-environment
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Check Links
        id: check-links
        run: |
          git ls-files '*.md' | xargs npx --yes markdown-link-check@3.14.2 -c .github/markdown_check_config.json

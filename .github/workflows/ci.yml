name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  validate-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate marketplace manifest
        run: |
          jq empty .claude-plugin/marketplace.json
          jq -e '.name and .owner.name and .metadata.version and .plugins' .claude-plugin/marketplace.json
      - name: Validate plugin manifest
        run: |
          jq empty plugins/exasol/.claude-plugin/plugin.json
          jq -e '.name and .version and .author.name' plugins/exasol/.claude-plugin/plugin.json
      - name: Check version consistency
        run: |
          mp=$(jq -r '.metadata.version' .claude-plugin/marketplace.json)
          pl=$(jq -r '.version' plugins/exasol/.claude-plugin/plugin.json)
          echo "Marketplace: $mp | Plugin: $pl"
          [ "$mp" = "$pl" ] || { echo "::error::Version mismatch: marketplace=$mp plugin=$pl"; exit 1; }
      - name: Check version is bumped
        if: github.event_name == 'pull_request'
        run: |
          git fetch --tags origin
          LATEST_TAG=$(git tag -l 'v*' | sort -V | tail -1)
          LATEST_VER="${LATEST_TAG#v}"
          NEW_VER=$(jq -r '.metadata.version' .claude-plugin/marketplace.json)
          echo "Latest release: $LATEST_VER | PR version: $NEW_VER"
          if [ -z "$LATEST_TAG" ]; then
            echo "No existing tags, skipping bump check"
            exit 0
          fi
          if [ "$(printf '%s\n%s' "$LATEST_VER" "$NEW_VER" | sort -V | tail -1)" = "$LATEST_VER" ]; then
            echo "::error::Version $NEW_VER is not greater than latest release $LATEST_VER — bump the version in both manifests"
            exit 1
          fi

  test-installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build test image
        run: docker build -f Dockerfile.test -t installer-test .
      - name: "Test: fresh install"
        run: docker run --rm -e SCENARIO=fresh installer-test sh test/test-installer.sh
      - name: "Test: idempotent re-run"
        run: docker run --rm -e SCENARIO=idempotent installer-test sh test/test-installer.sh
      - name: "Test: update from older version"
        run: docker run --rm -e SCENARIO=update installer-test sh test/test-installer.sh
      - name: "Test: fresh install (Claude Code only)"
        run: docker run --rm -e SCENARIO=fresh-claude installer-test sh test/test-installer.sh
      - name: "Test: fresh install (Codex only)"
        run: docker run --rm -e SCENARIO=fresh-codex installer-test sh test/test-installer.sh

  check-links:
    name: Docs
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out Repository
        id: check-out-repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js Environment
        id: set-up-node-js-environment
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Check Links
        id: check-links
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            files=$(git ls-files '*.md')
          else
            files=$(git diff --name-only --diff-filter=ACMRT "$BASE_SHA" "$GITHUB_SHA" -- '*.md')
          fi
          if [ -z "$files" ]; then
            echo "No Markdown files changed."
            exit 0
          fi
          markdown_files="$RUNNER_TEMP/markdown-files.txt"
          printf '%s\n' "$files" > "$markdown_files"
          printf '%s\n' "$files" | xargs npx --yes markdown-link-check@3.14.2 -c .github/markdown_check_config.json
          node - "$markdown_files" <<'NODE'
          const fs = require('fs');

          async function main() {
            const markdownFiles = fs.readFileSync(process.argv[2], 'utf8')
              .split(/\r?\n/)
              .filter(Boolean);
            const docsUrls = new Map();

            for (const file of markdownFiles) {
              const markdown = fs.readFileSync(file, 'utf8');
              for (const match of markdown.matchAll(/https:\/\/docs\.exasol\.com\/[^\s<>)"']+/g)) {
                const url = match[0].replace(/[.,;:!?]+$/, '');
                if (!docsUrls.has(url)) {
                  docsUrls.set(url, new Set());
                }
                docsUrls.get(url).add(file);
              }
            }

            let failed = false;
            for (const [url, files] of docsUrls) {
              try {
                const response = await fetch(url, {
                  redirect: 'follow',
                  headers: { 'user-agent': 'exasol-agent-skills-link-check' },
                });
                if ([403, 429].includes(response.status)) {
                  continue;
                }
                if (response.status >= 400) {
                  console.error(`::error::${url} returned HTTP ${response.status} in ${[...files].join(', ')}`);
                  failed = true;
                  continue;
                }
                const contentType = response.headers.get('content-type') || '';
                if (contentType.includes('text/html')) {
                  const body = await response.text();
                  if (/<title>\s*404 Page Not Found\s*<\/title>/i.test(body)) {
                    console.error(`::error::${url} returned a soft 404 page in ${[...files].join(', ')}`);
                    failed = true;
                  }
                }
              } catch (error) {
                console.error(`::error::Failed to check ${url} in ${[...files].join(', ')}: ${error.message}`);
                failed = true;
              }
            }

            if (failed) {
              process.exit(1);
            }
          }

          main().catch((error) => {
            console.error(`::error::Exasol docs soft-404 check failed: ${error.message}`);
            process.exit(1);
          });
          NODE

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [validate-plugin, test-installer, check-links]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.version.outputs.version }}" --generate-notes
